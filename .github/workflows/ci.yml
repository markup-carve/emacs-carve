name: CI

on:
  push:
    branches: [main, next2]
  pull_request:

jobs:
  test:
    name: Byte-compile and ERT
    runs-on: ubuntu-latest
    # Bounded on purpose. On 2026-08-19 `apt-get update` stalled on
    # archive.ubuntu.com and this job ran for the full six-hour default before
    # being cancelled, which left a green PR reading as dead for two days. The
    # job's real runtime is under thirty seconds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Byte-compile (errors fail the build)
        run: |
          emacs -Q --batch -L . -f batch-byte-compile carve-mode.el carve-lsp.el

      - name: Run ERT tests
        run: |
          emacs -Q --batch -L . \
            -l ert \
            -l carve-mode.el \
            -l carve-lsp.el \
            -l carve-mode-tests.el \
            -l carve-battery-tests.el \
            -l carve-lsp-tests.el \
            -l carve-cli-tests.el \
            -f ert-run-tests-batch-and-exit

      # Separate from the tests on purpose: this reaches the network, so a
      # failure means the vendored battery is stale (or GitHub is down), not
      # that the mode is wrong.
      - name: The vendored block battery still matches carve-grammars
        run: ./tools/check-battery-drift.sh

  minimum-emacs:
    # carve-mode declares Emacs 27.1. The test job above runs whatever Ubuntu
    # ships, which hid a void `string-empty-p' on 27 and 28.
    name: Byte-compile and ERT on Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        emacs: ['27.1', '28.2']
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Byte-compile (warnings fail the build)
        run: |
          emacs -Q --batch -L . --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile carve-mode.el carve-lsp.el
      - name: Run ERT tests
        run: |
          emacs -Q --batch -L . \
            -l ert \
            -l carve-mode.el \
            -l carve-lsp.el \
            -l carve-mode-tests.el \
            -l carve-battery-tests.el \
            -l carve-lsp-tests.el \
            -l carve-cli-tests.el \
            -f ert-run-tests-batch-and-exit

  engine-cli:
    # The preview and import commands against a real Carve 0.2 CLI. 0.2 is
    # not released, so the CLI is built from carve-js `next2` at a pinned
    # commit; CARVE_REQUIRE_CLI turns the tests' skip into a failure.
    name: ERT against the Carve 0.2 CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARVE_JS_REV: 456e04a9fb0b9e8b4315bade2d4012357235e410
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'
      - name: Build the carve CLI from carve-js next2
        run: |
          git init --quiet "$RUNNER_TEMP/carve-js"
          cd "$RUNNER_TEMP/carve-js"
          git fetch --quiet --depth 1 https://github.com/markup-carve/carve-js "$CARVE_JS_REV"
          git checkout --quiet FETCH_HEAD
          npm ci --ignore-scripts
          npm run build
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$PWD/dist/cli.js" "$RUNNER_TEMP/bin/carve"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run the CLI tests
        env:
          CARVE_REQUIRE_CLI: '1'
        run: |
          carve --version
          emacs -Q --batch -L . \
            -l ert \
            -l carve-mode.el \
            -l carve-cli-tests.el \
            -f ert-run-tests-batch-and-exit

  package-lint:
    name: package-lint and checkdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'
      - name: Lint the way MELPA does
        run: emacs -Q --batch -l tools/melpa-lint.el
