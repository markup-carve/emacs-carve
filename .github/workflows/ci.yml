name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Byte-compile and ERT
    runs-on: ubuntu-latest
    # Bounded on purpose. On 2026-08-19 `apt-get update` stalled on
    # archive.ubuntu.com and this job ran for the full six-hour default before
    # being cancelled, which left a green PR reading as dead for two days. The
    # job's real runtime is under thirty seconds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Byte-compile (errors fail the build)
        run: |
          emacs -Q --batch -L . -f batch-byte-compile carve-mode.el carve-lsp.el

      - name: Run ERT tests
        run: |
          emacs -Q --batch -L . \
            -l ert \
            -l carve-mode.el \
            -l carve-lsp.el \
            -l carve-mode-tests.el \
            -l carve-battery-tests.el \
            -l carve-lsp-tests.el \
            -f ert-run-tests-batch-and-exit

      # Separate from the tests on purpose: this reaches the network, so a
      # failure means the vendored battery is stale (or GitHub is down), not
      # that the mode is wrong.
      - name: The vendored block battery still matches carve-grammars
        run: ./tools/check-battery-drift.sh
